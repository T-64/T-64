<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131024"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.18" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.85" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="1.15" r="0.6">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="238" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="238" rx="16" fill="url(#glowBlue)"/>
  <rect x="1" y="1" width="998" height="238" rx="16" fill="url(#glowPurple)"/>
  <rect x="1" y="1" width="998" height="238" rx="16" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="998" height="238" rx="16" fill="url(#grid)"/>

  <!-- wordmark -->
  <text x="500" y="92" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#word)" filter="url(#soft)">Hi, I'm T-64</text>

  <!-- crossfading taglines -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#a5b1c2" text-anchor="middle">
    <text x="500" y="130" opacity="1">ML &amp; systems engineer — ads serving by day, 3D vision by night
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.31;0.33;0.64;0.66;1" dur="9.6s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="130" opacity="0">GPU inference for digital humans · streaming ML for 500k+ advertisers
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.64;0.66;1" dur="9.6s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="130" opacity="0">first-author: 3D Gaussian Splatting for dense RGB-D SLAM
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.97;0.99;1" dur="9.6s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="162" y="150" width="196" height="26" rx="13" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.55"/>
    <text x="260" y="167" fill="#a5d6ff">INFOTECH · Uni Stuttgart</text>
    <rect x="374" y="150" width="118" height="26" rx="13" fill="#161b22" stroke="#a371f7" stroke-opacity="0.55"/>
    <text x="433" y="167" fill="#e2d5ff">GPU Inference</text>
    <rect x="508" y="150" width="175" height="26" rx="13" fill="#161b22" stroke="#7ee787" stroke-opacity="0.5"/>
    <text x="595" y="167" fill="#c9f2cd">3D Gaussian Splatting</text>
    <rect x="699" y="150" width="139" height="26" rx="13" fill="#161b22" stroke="#e3b341" stroke-opacity="0.55"/>
    <text x="768" y="167" fill="#f5db92">Kaggle · 2 medals</text>
  </g>

  <!-- pipeline with travelling pulses -->
  <line x1="80" y1="210" x2="920" y2="210" stroke="#21262d" stroke-width="2"/>
  <line x1="80" y1="210" x2="920" y2="210" stroke="url(#line)" stroke-width="2" stroke-opacity="0.25"/>
  <circle r="4" fill="#58a6ff">
    <animateMotion path="M80,210 L920,210" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#a371f7">
    <animateMotion path="M80,210 L920,210" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#7ee787">
    <animateMotion path="M80,210 L920,210" dur="4.5s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="210" r="3.5" fill="#58a6ff"/>
  <circle cx="500" cy="210" r="3.5" fill="#a371f7"/>
  <circle cx="920" cy="210" r="3.5" fill="#7ee787"/>
</svg>
